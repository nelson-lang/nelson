name: nelson
channels:
  - conda-forge
channel_priority: strict
dependencies:
  # Build tools
  - cmake
  - ninja
  - just
  - pkg-config
  - cxx-compiler
  # GUI, graphics and help (qt6-main bundles qtbase, qtdeclarative, qtsvg and qttools)
  - qt6-main
  - libgl-devel
  - libegl-devel
  - libopengl-devel
  # Numerics
  - openblas
  - fftw
  - eigen
  - sundials
  - highs
  - qhull
  - tbb-devel
  - openmpi
  - openmpi-mpicc
  - openmpi-mpicxx
  # Data formats
  # conda-forge still carries a 1.5.6 build the solver may pick: Mat_GetDir needs 1.5.26
  - libmatio>=1.5.26
  - hdf5
  - libnetcdf
  - libarrow
  - libparquet
  - libxml2
  - libxml2-devel
  - libxslt
  # System libraries
  - libgit2
  - libcurl
  - gettext
  - icu
  - libffi
  - libzlib
  # Images
  - giflib
  - libtiff
  - libjpeg-turbo
  - libpng
  - libwebp
  # Audio (taglib is not packaged on conda-forge, the audio metadata stay optional)
  - portaudio
  - libsndfile
  - jack
  - alsa-lib
  # Python engine (the CI runs 3.14, conda-forge 3.15 has no embed libraries CMake finds)
  - python=3.14
  - numpy
