# ALSA inside the strict snap has no device access: route the default PCM to the
# PulseAudio or PipeWire server of the host through the audio-playback and
# audio-record plugs. The sysdefault fallback keeps ALSA usable without a server.
pcm.!default {
    type pulse
    fallback "sysdefault"
    hint {
        show on
        description "Default ALSA output (PulseAudio or PipeWire)"
    }
}
ctl.!default {
    type pulse
    fallback "sysdefault"
}
