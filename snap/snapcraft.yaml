name: nelson
base: core26
icon: $SNAP/gui/logo.png
summary: Nelson, a numerical computing language for engineering and science
description: |
  Nelson is a matrix and array programming language for engineering and scientific computing.
  It provides an interpreter, a high-level language, plotting tools, and numerical libraries such as Eigen.
  It supports data structures such as cell arrays, structs, and linear systems.
  Its module and overload mechanisms let users add data types and operations.
confinement: strict
adopt-info: nelson
compression: lzo

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

plugs:
  gtk-3-themes:
    interface: content
    target: $SNAP/data-dir/themes
    default-provider: gtk-common-themes
  icon-themes:
    interface: content
    target: $SNAP/data-dir/icons
    default-provider: gtk-common-themes
  sound-themes:
    interface: content
    target: $SNAP/data-dir/sounds
    default-provider: gtk-common-themes

environment:
  # Other, generally useful environment settings...
  # XDG config
  XDG_CACHE_HOME:  $SNAP_USER_COMMON/.cache
  XDG_CONFIG_HOME: $SNAP_USER_DATA/.config
  XDG_CONFIG_DIRS: $SNAP/etc/xdg
  XDG_DATA_DIRS:   $SNAP/usr/local/share:$SNAP/usr/share
  # XKB config
  XKB_CONFIG_ROOT: $SNAP/usr/share/X11/xkb
  XDG_RUNTIME_DIR: /tmp
  LD_LIBRARY_PATH: "$SNAP/usr/lib:$SNAP/usr/lib/$SNAP_LAUNCHER_ARCH_TRIPLET/:$SNAP/usr/lib/$SNAP_LAUNCHER_ARCH_TRIPLET/openblas-openmp:$SNAP/usr/lib/$SNAP_LAUNCHER_ARCH_TRIPLET/pulseaudio"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

parts:
  nelson:
    plugin: nil
    source: .
    # the CMake build compiles the web frontends with npm, the node snap matches .nvmrc
    build-snaps:
      - node/22/stable

    override-build: |
      craftctl default

      cmake -DCMAKE_INSTALL_PREFIX=/usr  -DCMAKE_BUILD_TYPE=Release -DQTDIR=/usr/lib/qt6 -DWITHOUT_IPC_MODULE=TRUE -DWITHOUT_MPI_MODULE=TRUE . 
      cmake --build . -- -j $(nproc)
      export XDG_RUNTIME_DIR=/tmp
      cmake --build . -- -j $(nproc) buildhelp

      # Use the packaged icon path in the desktop file.
      # This needs to happen post-build or the build versioning will show as "modified locally"
      sed -i 's|Icon=nelson|Icon=usr/share/icons/hicolor/128x128/apps/nelson\.png|' desktop/io.github.nelson_lang.Nelson.desktop

      DESTDIR=$CRAFT_PART_INSTALL cmake --build . -- install
      NELSON_VERSION=$(grep -oP '"version": "\K[^"]+' package.json)
      echo "NELSON_VERSION=$NELSON_VERSION"

      craftctl set grade=stable
      
      craftctl set version="$NELSON_VERSION"
      rm -rf $CRAFT_PART_INSTALL/usr/share/perl5/XML/
      rm -rf $CRAFT_PART_INSTALL/usr/share/texmf

    override-prime: |
      SNAP_LAUNCHER_ARCH_TRIPLET=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
      craftctl default
      rm -vf usr/lib/$SNAP_LAUNCHER_ARCH_TRIPLET/libc_malloc_debug.so

    # Ubuntu 26.04 (core26) package names: Arrow, Parquet, HiGHS and SUNDIALS 7 are all packaged there
    build-packages:
      # build tools
      - build-essential
      - cmake
      - pkg-config
      - gettext
      - locales-all
      - autotools-dev
      - libtool
      - automake
      # OpenGL
      - libglvnd-dev
      - libgl-dev
      # system libraries
      - zlib1g-dev
      - libffi-dev
      - libicu-dev
      - libxml2-dev
      - libxslt1-dev
      - libsqlite3-dev
      - libcurl4-openssl-dev
      - libgit2-dev
      - libtbb-dev
      - libpcre2-dev
      # numerics
      - libopenblas-openmp-dev
      - liblapack-dev
      - libfftw3-dev
      - libeigen3-dev
      - libarpack2-dev
      - libqhull-dev
      - libsundials-dev
      # the Ubuntu SUNDIALS headers include <mpi.h>
      - libopenmpi-dev
      - libhighs-dev
      - highs
      # data formats
      - libhdf5-dev
      - libmatio-dev
      - libnetcdf-dev
      - libarrow-dev
      - libparquet-dev
      # audio
      - libasound2-dev
      - libasound2-data
      - portaudio19-dev
      - libsndfile1-dev
      - libtag-dev
      - alsa-utils
      # images
      - libgif-dev
      - libjpeg-turbo8-dev
      - libpng-dev
      - libtiff-dev
      - libwebp-dev
      # Qt 6
      - qt6-base-dev
      - qt6-svg-dev
      - libqt6sql6-sqlite
      - libqt6sql6-mysql
      - qt6-declarative-dev
      - qml6-module-qtquick
      - qml6-module-qtquick-templates
      - qml6-module-qtquick-controls
      - qml6-module-qtquick-window
      - qml6-module-qtquick-dialogs
      - qml6-module-qtqml-workerscript
      - qml6-module-qtquick-layouts
      - qmlscene
      # Python engine
      - python3-dev
      - python3-numpy

    stage-packages:
      # runtime and the toolchain kept for mex and external modules
      - libc6
      - libstdc++6
      - libgomp1
      - locales-all
      - build-essential
      - cmake
      - pkg-config
      - gettext
      - libtool
      - automake
      # OpenGL
      - libgl1
      - libglvnd0
      - libegl1
      # system libraries
      - zlib1g
      - libffi8
      - libicu78
      - libxml2-16
      - libxslt1.1
      - libsqlite3-0
      - libcurl4t64
      - libgit2-1.9
      - libtbb12
      - libpcre2-32-0
      - libproxy1v5
      # numerics
      - libopenblas0-openmp
      - libfftw3-double3
      - libfftw3-single3
      - libarpack2t64
      - libqhull-r8.0
      - libopenmpi40
      - libsundials-core7
      - libsundials-cvodes7
      - libsundials-idas6
      - libsundials-kinsol7
      - libsundials-nvecserial7
      - libsundials-sunlinsol5
      - libsundials-sunmatrix5
      - libhighs1
      # data formats
      - libhdf5-310
      - libmatio14
      - libnetcdf22
      - libarrow2300
      - libparquet2300
      # audio: the ALSA pulse plugin routes PortAudio to the host sound server
      - libasound2t64
      - libasound2-data
      - libasound2-plugins
      - libpulse0
      - libportaudio2
      - libsndfile1
      - libtag2
      - libjack-jackd2-0
      - alsa-utils
      # images
      - libgif7
      - libjpeg-turbo8
      - libpng16-16t64
      - libtiff6
      - libwebp7
      # Qt 6
      - libqt6core6t64
      - libqt6gui6
      - libqt6widgets6
      - libqt6network6
      - libqt6dbus6
      - libqt6opengl6
      - libqt6openglwidgets6
      - libqt6printsupport6
      - libqt6xml6
      - libqt6concurrent6
      - libqt6test6
      - libqt6sql6
      - libqt6sql6-sqlite
      - libqt6sql6-mysql
      - libqt6svg6
      - libqt6help6
      - libqt6qml6
      - libqt6qmlmeta6
      - libqt6qmlmodels6
      - libqt6qmlworkerscript6
      - libqt6quick6
      - libqt6quickcontrols2-6
      - libqt6quicktemplates2-6
      - libqt6quickshapes6
      - qt6-qpa-plugins
      - qml6-module-qtquick
      - qml6-module-qtquick-templates
      - qml6-module-qtquick-controls
      - qml6-module-qtquick-window
      - qml6-module-qtquick-dialogs
      - qml6-module-qtqml-workerscript
      - qml6-module-qtquick-layouts
      - qmlscene
      # WebView window (WebUI loads libwebkit2gtk-4.1 at run time, GTK 3 comes from the gnome extension)
      - libwebkit2gtk-4.1-0
      # Python engine
      - libpython3.14
      - python3-pip
      - python3-numpy

  alsa-config:
    plugin: dump
    source: snap/local
    organize:
      asound.conf: etc/asound.conf

apps:
  nelson:
    command: usr/bin/nelson
    # the gnome extension supplies the GTK 3 runtime the native WebView window needs
    extensions: [gnome]
    desktop: usr/share/applications/io.github.nelson_lang.Nelson.desktop
    environment:
      XDG_CURRENT_DESKTOP: $XDG_CURRENT_DESKTOP:Unity:Unity7
      LD_LIBRARY_PATH: "/usr/lib/Nelson:/usr/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/oss4-libsalsa/:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/openblas-openmp:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/blas:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/lapack:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libproxy:$SNAP/usr/lib"

      LOCPATH: "$SNAP/usr/lib/locale"
      PATH: "$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib:$SNAP/usr/bin:$SNAP/bin:/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/bin:$PATH"
      QTDIR: "/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/"
      QTDIR_BINARIES: "$SNAP/usr/lib/qt6/bin/"
      __NELSON_PYTHON_VERSION__: "3.14"
      __NELSON_PYTHON_EXECUTABLE__: "/usr/bin/python3"
      __NELSON_PYTHON_LIBRARY__: "libpython3.14.so.1.0"
      __NELSON_PYTHON_HOME__: "/usr"
      ALSA_CONFIG_PATH: "$SNAP/etc/asound.conf"
      # the WebKit bubblewrap sandbox cannot start under strict confinement, the snap is the sandbox
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"

    plugs: &plugs
      - jack1
      - audio-playback
      - audio-record
      - desktop
      - desktop-legacy
      - home
      - network
      - network-bind
      - opengl
      - removable-media
      - unity7
      - wayland
      - x11
      - browser-support
      - hardware-observe

layout:
  /usr/bin/nelson:
    bind-file: $SNAP/usr/bin/nelson
  /usr/bin/nelson_f2c:
    bind-file: $SNAP/usr/bin/nelson_f2c
  /usr/bin/nelson-cli:
    symlink: $SNAP/usr/bin/nelson-cli
  /usr/bin/nelson-adv-cli:
    symlink: $SNAP/usr/bin/nelson-adv-cli
  /usr/bin/nelson-gui:
    symlink: $SNAP/usr/bin/nelson-gui
  /usr/bin/nelson-webview:
    symlink: $SNAP/usr/bin/nelson-webview
  /usr/bin/nelson-cli-exec:
    bind-file: $SNAP/usr/bin/nelson-cli-exec
  /usr/bin/nelson-adv-cli-exec:
    bind-file: $SNAP/usr/bin/nelson-adv-cli-exec
  /usr/bin/nelson-gui-exec:
    bind-file: $SNAP/usr/bin/nelson-gui-exec
  /usr/bin/nelson-webview-exec:
    bind-file: $SNAP/usr/bin/nelson-webview-exec

  /usr/lib/Nelson:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/Nelson

  /usr/share/Nelson:
    bind: $SNAP/usr/share/Nelson

  /usr/local/lib:
    symlink: $SNAP/usr/local/lib

  # Make staged qt plugins available in expected locations
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6

  # Make staged dri and pulseaudio modules available in expected locations
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio

  # Dynamic link (used for external modules and mex)
  /usr/include:
    bind: $SNAP/usr/include
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libc_nonshared.a:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libc_nonshared.a
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libmvec_nonshared.a:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libmvec_nonshared.a
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libpthread_nonshared.a:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libpthread_nonshared.a

  #alsa
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
