  Source icon for the Nelson Notebook document (.nlx). Generate the
  platform binaries from this file (no image tooling is bundled in the repo):
    - Windows: resources/nlx.ico (multi-size 16/32/48/256), embedded in
      Nelson-gui.exe resources at a new icon index for the file association.
    - macOS:   a dedicated .icns (or keep Nelson.icns).
    - Linux:   hicolor PNGs for the application/x-nelson-notebook MIME type.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="nlxPage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="nlxRun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7de1"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
  </defs>
  <!-- document page with a folded corner -->
  <path d="M56 20h104l40 40v176a16 16 0 0 1-16 16H56a16 16 0 0 1-16-16V36a16 16 0 0 1 16-16z"
        fill="url(#nlxPage)" stroke="#c3ccd8" stroke-width="4"/>
  <path d="M160 20l40 40h-32a8 8 0 0 1-8-8z" fill="#d6deea"/>
  <!-- formatted-text lines (the "live" document) -->
  <g fill="#9aa7b8">
    <rect x="68" y="78" width="88" height="10" rx="5"/>
    <rect x="68" y="100" width="120" height="8" rx="4"/>
    <rect x="68" y="118" width="104" height="8" rx="4"/>
  </g>
  <!-- code cell with a run button -->
  <rect x="64" y="146" width="128" height="62" rx="10" fill="#1b2330"/>
  <g fill="#6ea8fe" font-family="monospace" font-size="15">
    <rect x="80" y="160" width="46" height="8" rx="4" fill="#5b7cff"/>
    <rect x="80" y="178" width="70" height="8" rx="4" fill="#3f4b63"/>
  </g>
  <circle cx="168" cy="177" r="18" fill="url(#nlxRun)"/>
  <path d="M162 169l14 8-14 8z" fill="#ffffff"/>
</svg>
