name: "Minimal Build"

on:
  # the Run workflow button in the Actions tab, this build is not part of the push CI
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  Ubuntu_24_04_minimal:
    name: Ubuntu 24.04 - Minimal
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        timeout-minutes: 20
        run: sudo --preserve-env=GITHUB_ACTIONS $GITHUB_WORKSPACE/tools/install_dependencies/install-ubuntu-24.04-minimal.sh

      - name: Get package version
        uses: jaywcjlove/github-action-package@v2.1.0
        id: json_version

      - name: Update version
        run: just update_version

      # MINIMAL_BUILD turns every optional module off, tests_manager included: no test step
      - name: Configure
        run: |
          just config "-DCMAKE_BUILD_TYPE=Release -DMINIMAL_BUILD=ON -G Ninja ."

      - name: Build
        run: just build
