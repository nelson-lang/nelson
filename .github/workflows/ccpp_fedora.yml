name: "Fedora Build"

on:
  # the Run workflow button in the Actions tab, this build is not part of the push CI
  workflow_dispatch:
  workflow_call:

permissions:
  checks: write
  contents: read

jobs:
  Fedora_44:
    name: Fedora 44 x86-64
    runs-on: ubuntu-26.04
    container: fedora:44
    timeout-minutes: 120
    env:
      QTDIR_BINARIES: /usr/lib64/qt6/bin

    steps:
      - name: Prepare container
        run: dnf install -y git sudo

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: $GITHUB_WORKSPACE/tools/install_dependencies/install-fedora.sh

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      - uses: julia-actions/setup-julia@v3.0.3
        with:
          arch: "x64"

      - name: Get package version
        uses: jaywcjlove/github-action-package@v2.1.0
        id: json_version

      - name: Update version
        run: just update_version

      # MPI stays off
      - name: Configure
        run: |
          just config "-DCMAKE_BUILD_TYPE=Release -DWITHOUT_MPI_MODULE=ON -G Ninja ."

      - name: Build
        run: just build

      - name: Set Python Environment for Nelson
        run: just setup_python

      - name: Set Julia Environment for Nelson
        run: just setup_julia

      - name: Build help
        run: just build_help

      - name: Minimal tests
        run: just minimal_tests
