name: "Windows Build"

on:
  workflow_call:

jobs:
  Windows_win64:
    name: Windows 64 bits
    runs-on: windows-2025
    defaults:
      run:
        shell: cmd
    timeout-minutes: 120
    outputs:
      version: ${{ steps.json_version.outputs.version }}

    steps:
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Install Inno-setup
        run: winget install --id JRSoftware.InnoSetup -e --accept-source-agreements --accept-package-agreements

      - name: Install Just
        run: |
          winget install --id Casey.Just -e --accept-source-agreements --accept-package-agreements
          echo %LOCALAPPDATA%\Microsoft\WinGet\Links>> %GITHUB_PATH%

      - uses: julia-actions/setup-julia@v3.0.3
        with:
          arch: "x64"

      - name: Install MS-MPI
        run: |
          $null = mkdir c:/install
          (new-object net.webclient).DownloadFile("https://download.microsoft.com/download/a/5/2/a5207ca5-1203-491a-8fb8-906fd68ae623/msmpisetup.exe", "C:\install\MSMpiSetup.exe")
          C:/install/MSMpiSetup.exe -unattend -minimal
        shell: powershell

      - name: Disable Windows Defender real-time scan
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: powershell

      - name: Checkout
        uses: actions/checkout@v7

      - name: Get package version
        uses: jaywcjlove/github-action-package@v2.1.0
        id: json_version

      - name: Update version
        run: just -f justfile.win update_version

      - name: Install dependencies
        run: just -f justfile.win install_dependencies::win64 remove-debug

      - name: Build Nelson
        run: just -f justfile.win build::win64

      - name: Set Python Environment for Nelson
        run: just -f justfile.win setup_python::win64

      - name: Set Julia Environment for Nelson
        run: just -f justfile.win setup_julia::win64

      - name: Copy Python in Nelson distribution
        run: |
          xcopy %Python_ROOT_DIR% %GITHUB_WORKSPACE%\modules\python_engine\thirdparty\python /E /I /Y
          del %GITHUB_WORKSPACE%\modules\python_engine\thirdparty\python\python-3*-amd64.exe

      - name: Build help
        run: just -f justfile.win build_help::win64

      - name: Minimal tests
        run: |
          set NELSON_TERM_IS_UNICODE_SUPPORTED=TRUE
          just -f justfile.win minimal_tests::win64

      - name: Create artifacts directory
        run: |
          if not exist "%GITHUB_WORKSPACE%\artifacts" mkdir "%GITHUB_WORKSPACE%\artifacts"

      - name: Package Nelson
        run: just -f justfile.win package::win64

      - name: Copy installer in artifacts directory
        run: move "%GITHUB_WORKSPACE%\Nelson-*.exe" "%GITHUB_WORKSPACE%\artifacts\"

      - uses: actions/upload-artifact@v7
        with:
          name: nelson-installer-windows-amd64-${{ steps.json_version.outputs.version }}.${{ github.run_number }}
          path: artifacts/

  Windows_win64_benchs:
    name: Windows 64 bits - Benchmarks
    needs: Windows_win64
    runs-on: windows-2025
    defaults:
      run:
        shell: cmd
    timeout-minutes: 60

    steps:
      - uses: julia-actions/setup-julia@v3.0.3
        with:
          arch: "x64"

      - name: Install MS-MPI
        run: |
          $null = mkdir c:/install
          (new-object net.webclient).DownloadFile("https://download.microsoft.com/download/a/5/2/a5207ca5-1203-491a-8fb8-906fd68ae623/msmpisetup.exe", "C:\install\MSMpiSetup.exe")
          C:/install/MSMpiSetup.exe -unattend -minimal
        shell: powershell

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: nelson-installer-windows-amd64-${{ needs.Windows_win64.outputs.version }}.${{ github.run_number }}

      - name: Install Nelson with installer
        run: |
          Nelson-${{ needs.Windows_win64.outputs.version }}.%GITHUB_RUN_NUMBER%-x86-64.exe /SP- /VERYSILENT /ALLUSERS /DIR="C:\Program Files\Nelson ${{ needs.Windows_win64.outputs.version }}.%GITHUB_RUN_NUMBER%"

      - name: Zip Nelson install directory
        run: |
          if (-not (Test-Path "$env:GITHUB_WORKSPACE/artifacts")) { New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE/artifacts" }
          & "C:/Program Files/7-Zip/7z" a -tzip "$env:GITHUB_WORKSPACE/artifacts/Nelson-${{ needs.Windows_win64.outputs.version }}.$env:GITHUB_RUN_NUMBER-x86-64.zip" "C:\Program Files\Nelson ${{ needs.Windows_win64.outputs.version }}.$env:GITHUB_RUN_NUMBER"
        shell: powershell

      - name: Benchs
        env:
          NELSON_TERM_IS_UNICODE_SUPPORTED: "TRUE"
          TESTS_RESULT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set PATH=C:\Program Files\Microsoft MPI\Bin;%PATH%
          "C:\Program Files\Nelson ${{ needs.Windows_win64.outputs.version }}.%GITHUB_RUN_NUMBER%\bin\x64\nelson-adv-cli" --noipc --quiet -f "C:\Program Files\Nelson ${{ needs.Windows_win64.outputs.version }}.%GITHUB_RUN_NUMBER%\tools\benchmark_all\runbenchmark_all.m"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nelson-benchmarks-windows-amd64-${{ needs.Windows_win64.outputs.version }}.${{ github.run_number }}
          path: artifacts/

  Windows_win64_tests:
    name: Windows 64 bits - Tests (Shard ${{ matrix.shard }}/5)
    needs: Windows_win64
    runs-on: windows-2025
    defaults:
      run:
        shell: cmd
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - uses: julia-actions/setup-julia@v3.0.3
        with:
          arch: "x64"

      - name: Install MS-MPI
        run: |
          $null = mkdir c:/install
          (new-object net.webclient).DownloadFile("https://download.microsoft.com/download/a/5/2/a5207ca5-1203-491a-8fb8-906fd68ae623/msmpisetup.exe", "C:\install\MSMpiSetup.exe")
          C:/install/MSMpiSetup.exe -unattend -minimal
        shell: powershell

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: nelson-installer-windows-amd64-${{ needs.Windows_win64.outputs.version }}.${{ github.run_number }}

      - name: Install Nelson with installer
        run: |
          Nelson-${{ needs.Windows_win64.outputs.version }}.%GITHUB_RUN_NUMBER%-x86-64.exe /SP- /VERYSILENT /ALLUSERS /DIR="C:\Program Files\Nelson ${{ needs.Windows_win64.outputs.version }}.%GITHUB_RUN_NUMBER%"

      - name: Create artifacts directory
        run: |
          if not exist "%GITHUB_WORKSPACE%\artifacts" mkdir "%GITHUB_WORKSPACE%\artifacts"

      - name: Tests
        env:
          NELSON_TEST_SHARD_INDEX: ${{ matrix.shard }}
          NELSON_TEST_SHARD_COUNT: 5
          NELSON_TERM_IS_UNICODE_SUPPORTED: "TRUE"
          TESTS_RESULT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set PATH=C:\Program Files\Microsoft MPI\Bin;%PATH%
          "C:\Program Files\Nelson ${{ needs.Windows_win64.outputs.version }}.%GITHUB_RUN_NUMBER%\bin\x64\nelson-adv-cli" --noipc --quiet -f "C:\Program Files\Nelson ${{ needs.Windows_win64.outputs.version }}.%GITHUB_RUN_NUMBER%\tools\tests_all\runtests_all.m"

      - name: Rename test results with shard index
        if: always()
        run: |
          Get-ChildItem "$env:GITHUB_WORKSPACE/artifacts" -File | ForEach-Object {
            $newName = $_.BaseName + "-shard-${{ matrix.shard }}" + $_.Extension
            Rename-Item $_.FullName -NewName $newName
          }
        shell: powershell

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nelson-test-results-windows-shard-${{ matrix.shard }}-${{ needs.Windows_win64.outputs.version }}.${{ github.run_number }}
          path: artifacts/

  Windows_win64_merge_results:
    name: Windows 64 bits - Merge Results
    if: always()
    needs: [Windows_win64, Windows_win64_tests, Windows_win64_benchs]
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      # the test-reporter needs the git context, the merge step needs .github/scripts
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: Download all test results
        uses: actions/download-artifact@v8
        with:
          pattern: nelson-test-results-windows-shard-*
          merge-multiple: true
          path: results/

      - name: Download benchmark results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: nelson-benchmarks-windows-amd64-${{ needs.Windows_win64.outputs.version }}.${{ github.run_number }}
          path: results/

      # one result file per platform in the final artifact: the shard files stay only when the merge failed
      - name: Merge shard results
        id: merge
        continue-on-error: true
        run: python3 .github/scripts/merge_test_shards.py results

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: "Windows Tests"
          path: "results/tests_all-*.xml"
          reporter: java-junit
          fail-on-error: false
          list-suites: failed
          list-tests: failed

      - uses: actions/upload-artifact@v7
        with:
          name: nelson-github-action-artifacts-windows-amd64-${{ needs.Windows_win64.outputs.version }}.${{ github.run_number }}
          path: results/

      # the shard artifacts are merged into the final one above: they are deleted once it is
      # uploaded (the read-only token of a pull request from a fork cannot delete them)
      - name: Delete shard artifacts
        if: steps.merge.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("nelson-test-results-windows-shard-")) | .id' \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"
