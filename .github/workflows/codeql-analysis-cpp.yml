name: "CodeQL analysis (C/C++)"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # a weekly scan picks up new queries on an unchanged tree
    - cron: "30 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (c-cpp)
    # same runner and dependency script as the Ubuntu build of the C/C++ CI
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        # sudo resets the environment, the script needs GITHUB_ACTIONS to skip the slow apt upgrade
        timeout-minutes: 30
        run: sudo --preserve-env=GITHUB_ACTIONS $GITHUB_WORKSPACE/tools/install_dependencies/install-ubuntu-26.04.sh

      # the CMake build also builds the web frontends, which need npm
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      - uses: julia-actions/setup-julia@v3.0.3
        with:
          arch: "x64"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended,security-and-quality

      # CodeQL traces this build: the whole tree is compiled, as in the Ubuntu CI
      - name: Build
        run: |
          just config "-DCMAKE_BUILD_TYPE=Release -G Ninja ."
          just build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
