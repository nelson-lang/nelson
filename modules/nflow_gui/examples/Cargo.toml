[package]
name    = "nflow_model"
version = "0.1.0"
edition = "2021"

[lib]
name = "nflow_model"
path = "src/lib.rs"

[[bin]]
name = "nflow_run"
path = "src/main.rs"

[dependencies]
libm = "0.2"   # no_std-compatible math

[profile.release]
opt-level = "z"  # size-optimised for embedded targets
lto       = true
codegen-units = 1
